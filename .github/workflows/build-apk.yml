# Manual "ship a release" workflow: builds the R8-minified release APK (using the
# same committed debug.keystore as the debug build, so every build — local or CI —
# carries the same signature), names a versioned human-readable copy alongside the
# app-release.apk, and files them as a GitHub Release. Run it from the Actions tab,
# or with `gh workflow run build-apk.yml -f version=2.0.0`; leave the version blank
# to auto-bump the patch from the latest release (1.0.0 -> 1.0.1). versionCode is
# derived from the version by stripping the dots (1.0.0 -> 100), so update checkers
# keying off it still see each new semantic version as a fresh build.

name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.0.0). Leave blank to auto-bump the patch."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history (not the default shallow depth-1 clone) so the commit-message step below
      # can walk back to the previous release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Blank input auto-bumps the patch from the latest release tag, so the usual run needs no
      # typing; pass a version (e.g. 2.0.0) only when you want to jump major/minor.
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -z "$latest" ]; then
              version="1.0.0"
            else
              latest="${latest#v}"
              major=$(echo "$latest" | cut -d. -f1)
              minor=$(echo "$latest" | cut -d. -f2)
              patch=$(echo "$latest" | cut -d. -f3)
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(echo "$version" | tr -d '.')" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version"

      # versionCode = dotted version with the dots removed (1.0.0 -> 100). Update checkers
      # (Obtainium, Android) key off versionCode and need it to strictly increase; stripping dots
      # does that across ascending semantic versions.
      - name: Build release APK
        run: ./gradlew assembleRelease -PappVersionCode=${{ steps.version.outputs.code }} -PappVersionName=${{ steps.version.outputs.version }}

      # A second, human-readable copy of the same APK alongside the original app-release.apk —
      # not a replacement. Keeping app-release.apk's name unchanged is what lets
      # .../releases/latest/download/app-release.apk stay a fixed, version-less URL that always
      # resolves to the newest build (bookmark/QR code/Obtainium-friendly); the versioned copy is
      # for humans browsing the release page who want the version visible in the filename itself.
      - name: Add versioned copy of the APK
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/OwnApps-${{ steps.version.outputs.version }}.apk"

      # Downloadable from the Actions tab for this specific run (kept for ~90 days).
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ownapps-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/OwnApps-${{ steps.version.outputs.version }}.apk

      # Release body lists the title of every commit since the last release tag (falling back to
      # the full history if this is the first release), so release notes describe everything that
      # shipped instead of just the HEAD commit.
      - name: Get commit messages since last release
        id: commit_message
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          {
            echo 'message<<EOF'
            git log "$RANGE" --pretty='- %s'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Each release gets its own tag (rather than overwriting one shared "latest" release) so
      # update checkers like Obtainium — which detect new versions by tag, not by inspecting the
      # APK — actually see a new version on every build. GitHub's own generated
      # ".../releases/latest/download/app-release.apk" URL still always resolves to whichever
      # release is newest, so this doesn't lose the stable permanent-download-link use case.
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.commit_message.outputs.message }}
          artifacts: "app/build/outputs/apk/release/app-release.apk,app/build/outputs/apk/release/OwnApps-${{ steps.version.outputs.version }}.apk"
          prerelease: false
